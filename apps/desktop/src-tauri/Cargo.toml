[package]
name = "dark-souls-guide-desktop"
version = "1.0.0"
description = "Dark Souls I Guide desktop companion"
authors = ["Dark Souls Guide Team"]
license = "MIT"
repository = ""
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = ["api-all", "system-tray"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
